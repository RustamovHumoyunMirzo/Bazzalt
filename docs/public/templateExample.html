<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} | BAZZALT Docs {{VERSION}}</title>
  <link rel="stylesheet" href="{{ROOT}}assets/docs.css">
  <script src="{{ROOT}}assets/theme.js"></script>
  <script defer src="{{ROOT}}assets/catalog.js"></script>
  <script defer src="{{ROOT}}assets/docs.js"></script>
</head>
<body data-root="{{ROOT}}" data-version="{{VERSION}}" data-page="{{PAGE}}">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="{{ROOT}}index.html">BAZZALT Docs</a>
    <button class="nav-toggle" aria-controls="sidebar" aria-expanded="false">Navigation</button>
    <div class="header-tools">
      <label>Version <select id="version" aria-label="Documentation version">{{VERSIONS}}</select></label>
      <label>Language <select id="language" aria-label="Documentation language">{{LANGUAGES}}</select></label>
      <button data-search-open>Search <kbd>Ctrl K</kbd></button>
      <button class="theme-btn" aria-label="Switch color theme">Theme</button>
    </div>
  </header>
  <div class="docs-layout">
    <aside id="sidebar" aria-label="Documentation navigation">{{NAV}}</aside>
    <main id="content" tabindex="-1">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="{{ROOT}}index.html">Docs</a> / {{GROUP}} / {{TITLE}}</nav>
      <article class="doc">{{BODY}}</article>
      <nav class="pager" aria-label="Previous and next guide">{{PAGER}}</nav>
    </main>
    <aside class="contents" aria-label="On this page"><strong>On this page</strong><nav>{{TOC}}</nav></aside>
  </div>
  <footer>BAZZALT {{VERSION}} documentation · {{LANGUAGE_NAME}}</footer>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="search-header"><h2 id="search-title">Search documentation</h2><button data-search-close aria-label="Close search">Close</button></div>
    <label for="search-input">Search pages and topics</label>
    <input id="search-input" type="search" autocomplete="off" placeholder="Try: transform, Lua, material">
    <p id="search-status" role="status" aria-live="polite"></p>
    <ul id="search-results"></ul>
  </dialog>
</body>
</html>
