name: Windows 32-bit Game Runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-32-bit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/windows-product.yml
    with:
      product: core
      architecture: x86
