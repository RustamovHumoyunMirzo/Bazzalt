name: Windows ARM64 Game Runtime
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build tools
        run: |
          python -m pip install -r requirements-build.txt PySide6==6.10.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sdk
        with:
          path: deps/filament
          key: filament-1.77.0-windows-arm64-v1
      - name: Native pinned ARM64 renderer SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: python scripts/build_arm64_dependencies.py --platform windows
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: deps/filament
          key: filament-1.77.0-windows-arm64-v1
      - name: Pinned engine dependencies
        shell: pwsh
        run: |
          foreach ($dependency in @("entt","rapidyaml","sdl3","stb_image","lua","sol2","miniaudio","jolt","freetype","text_shaping")) { & "scripts/get_$dependency.ps1"; if ($LASTEXITCODE -ne 0) { throw "Dependency failed: $dependency" } }
      - name: Build and verify native runtime
        run: |
          cmake -S . -B build/arm64 -A ARM64 -DBAZZALT_BUILD_EDITOR_BRIDGE=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build build/arm64 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          ctest --test-dir build/arm64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Package Core and runtime template
        run: python scripts/package_arm64.py --platform windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-arm64
          path: dist/*-arm64.zip*
          if-no-files-found: error
