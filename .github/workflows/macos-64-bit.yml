name: macOS 64-bit
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            architecture: x64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          brew install ninja ccache openssl@3 pkg-config
          python -m pip install -r requirements-build.txt PySide6==6.10.2 pybind11==3.0.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/ccache
          key: macos-${{ matrix.architecture }}-objects-${{ github.run_id }}
          restore-keys: macos-${{ matrix.architecture }}-objects-
      - name: Download pinned dependencies
        run: |
          for dependency in entt rapidyaml filament sdl3 stb_image lua sol2 miniaudio jolt freetype text_shaping pybind11; do
            if [ -f "scripts/get_${dependency}.sh" ]; then sh "scripts/get_${dependency}.sh"; fi
          done
      - name: Build missing native Filament architecture on CI
        env:
          BAZZALT_MAC_ARCH: ${{ matrix.cmake_arch }}
        run: sh scripts/build_macos_dependencies.sh
      - name: Configure and build native products
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBAZZALT_FILAMENT_METAL=ON -DBAZZALT_FILAMENT_OPENGL=OFF -DBAZZALT_FILAMENT_VULKAN=OFF -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build --parallel 3
      - name: Native regression suite
        run: ctest --test-dir build --output-on-failure --output-junit build/native-tests.xml
      - name: Editor, Hub, compiler and documentation regressions
        run: |
          python -m unittest discover -s Editor/tests
          python -m unittest discover -s Launcher/tests
          python -m unittest discover -s Compiler/tests
          python -m unittest discover -s tests
          python scripts/sync_api_reference.py --check
          python scripts/build_public_docs.py --check
      - name: Detect Metal availability on the hosted runner
        run: |
          printf '#import <Metal/Metal.h>\nint main(){@autoreleasepool{return MTLCreateSystemDefaultDevice()?0:1;}}\n' > build/metal-probe.mm
          clang++ build/metal-probe.mm -framework Foundation -framework Metal -o build/metal-probe
          if build/metal-probe; then
            echo "BAZZALT_MAC_GPU_TEST=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Hosted runner has no Metal device; GPU presentation needs a Metal-capable Mac. Native bundle verification and Cocoa menu tests still run."
            echo "BAZZALT_MAC_GPU_TEST=0" >> "$GITHUB_ENV"
          fi
      - name: Cocoa menu, native Metal viewport and packaged game
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m unittest Editor.tests.test_macos_native Compiler.tests.test_macos_build -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-logs-macos-${{ matrix.architecture }}
          path: |
            build/native-tests.xml
            build/Testing/Temporary/*.log
