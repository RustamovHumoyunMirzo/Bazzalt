name: Windows Release Suite
on:
  workflow_dispatch:
  push:
    tags: ['release-v*']
permissions:
  contents: read
jobs:
  editor:
    uses: ./.github/workflows/windows-product.yml
    with:
      product: editor
  core:
    uses: ./.github/workflows/windows-product.yml
    with:
      product: core
  hub:
    uses: ./.github/workflows/windows-product.yml
    with:
      product: hub
  tools:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
      - name: Download, verify, and package shared LLVM
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $versions=Get-Content releases/versions.json -Raw | ConvertFrom-Json
          & scripts/get_llvm.ps1 -Version $versions.llvm -Sha256 $versions.llvm_sha256
          python scripts/release_artifacts.py --root toolchain/llvm --product llvm --version $versions.llvm --architecture x64 --output "dist/releases/Bazzalt-llvm-$($versions.llvm)-windows-x64.zip" --base-url "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_REF"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM package failed validation' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-tools-x64
          path: dist/releases/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/release-v')
    needs: [editor, core, hub, tools]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
      - run: python -m pip install PySide6==6.10.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*-x64
          path: release
          merge-multiple: true
      - name: Publish verified packages and Hub catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $entries=Get-ChildItem release -Filter '*.json' | ForEach-Object { $_.FullName }
          python scripts/make_download_catalog.py --output release/downloads.json --base-url "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG" @entries
          if ($LASTEXITCODE -ne 0) { throw 'Invalid download catalog' }
          $files=Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @files --title "BAZZALT $env:RELEASE_TAG" --notes "Independent Windows x64 Editor/Core packages and Hub-only installer. See downloads.json for versions and checksums. Shared LLVM is a separate download. Win32 is not yet supported."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
