name: Windows product builder
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      version:
        default: ''
        type: string
      architecture:
        description: 'Architecture to build: both, x86, or x64'
        default: both
        type: string
permissions:
  contents: read
jobs:
  x64:
    if: inputs.architecture == 'both' || inputs.architecture == 'x64'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
          architecture: x64
      - name: Python build dependencies
        run: python -m pip install -r requirements-build.txt PySide6==6.10.2 pybind11==3.0.2
      - name: Fetch pinned native dependencies
        if: inputs.product != 'hub'
        shell: pwsh
        run: |
          & scripts/get_entt.ps1
          & scripts/get_rapidyaml.ps1
          & scripts/get_sdl3.ps1
          & scripts/get_filament.ps1
      - name: Configure native runtime
        if: inputs.product != 'hub'
        shell: pwsh
        run: |
          $bridge = if ('${{ inputs.product }}' -eq 'editor') {'ON'} else {'OFF'}
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DPython_EXECUTABLE=$((Get-Command python).Source)" "-DBAZZALT_BUILD_EDITOR_BRIDGE=$bridge" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Build and test core
        if: inputs.product != 'hub'
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build -C Release --verbose --output-on-failure --output-junit "$PWD/build/native-tests.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Preserve native test diagnostics
        if: always() && inputs.product != 'hub'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-windows-${{ inputs.product }}-x64
          path: |
            build/Testing/Temporary/*.log
            build/native-tests.xml
          if-no-files-found: ignore
      - name: Test Hub, installs, tools, and resources
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s Launcher/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Hub/download tests failed' }
          python -m unittest Editor.tests.test_scripting Editor.tests.test_compiled_resources Editor.tests.test_file_association_preferences Editor.tests.test_restart_settings Editor.tests.test_runtime_tick_failure -v
          if ($LASTEXITCODE -ne 0) { throw 'Resource/compiler/preferences tests failed' }
      - name: Install Inno Setup
        if: inputs.product == 'hub'
        run: choco install innosetup --yes --no-progress
      - name: Package independent product
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          & scripts/build_windows_release.ps1 -Product $env:PRODUCT -Version $env:VERSION -Architecture x64 -DownloadBaseUrl "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ inputs.product }}-x64
          path: |
            dist/releases/*.zip
            dist/releases/*-Setup.exe
            dist/releases/*.json
          if-no-files-found: error
          retention-days: 30
  x86:
    if: inputs.architecture == 'both' || inputs.architecture == 'x86'
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
      - name: Build genuine Win32 dependencies from pinned sources
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          $stage=switch ($env:PRODUCT) { 'hub' {'gui'} 'core' {'filament'} default {'all'} }
          & scripts/build_windows_x86_dependencies.ps1 -Stage $stage -Parallel 2
      - name: Core-only host resource generator
        if: inputs.product == 'core'
        run: python -m pip install PySide6==6.10.2
      - name: Fetch architecture-independent engine dependencies
        if: inputs.product != 'hub'
        run: |
          & scripts/get_entt.ps1
          & scripts/get_rapidyaml.ps1
          & scripts/get_sdl3.ps1
      - name: Configure and test the Win32 runtime
        if: inputs.product != 'hub'
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          . scripts/windows_toolchain.ps1
          Import-BazzaltMsvc x86
          $python=(Resolve-Path build/win32-bootstrap/python-package/tools/python.exe).Path
          if ($env:PRODUCT -eq 'core') { $python=(Get-Command python).Source }
          $filament=(Resolve-Path build/win32-bootstrap/filament-x86).Path
          $bridge=if ($env:PRODUCT -eq 'editor') {'ON'} else {'OFF'}
          cmake -S . -B build/x86 -G "Visual Studio 17 2022" -A Win32 "-DPython_EXECUTABLE=$python" "-DBAZZALT_FILAMENT_DIR=$filament" "-DBAZZALT_BUILD_EDITOR_BRIDGE=$bridge" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Win32 CMake configuration failed' }
          cmake --build build/x86 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Win32 runtime build failed' }
          ctest --test-dir build/x86 -C Release --verbose --output-on-failure --output-junit "$PWD/build/x86/native-tests.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Win32 native tests failed' }
      - name: Preserve Win32 native test diagnostics
        if: always() && inputs.product != 'hub'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-windows-${{ inputs.product }}-x86
          path: |
            build/x86/Testing/Temporary/*.log
            build/x86/native-tests.xml
          if-no-files-found: ignore
      - name: Test actual Win32 GUI and tools
        if: inputs.product != 'core'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & build/win32-bootstrap/python-package/tools/python.exe -m unittest discover -s Launcher/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Win32 GUI tests failed' }
          & build/win32-bootstrap/python-package/tools/python.exe -m unittest Editor.tests.test_scripting Editor.tests.test_compiled_resources Editor.tests.test_file_association_preferences Editor.tests.test_restart_settings Editor.tests.test_runtime_tick_failure -v
          if ($LASTEXITCODE -ne 0) { throw 'Win32 resource/compiler/preferences tests failed' }
      - name: Install Inno Setup
        if: inputs.product == 'hub'
        run: choco install innosetup --yes --no-progress
      - name: Package Win32 product
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $env:PATH=(Resolve-Path build/win32-bootstrap/python-package/tools).Path+';'+$env:PATH
          & scripts/build_windows_release.ps1 -Product $env:PRODUCT -Version $env:VERSION -Architecture x86 -BuildDirectory build/x86 -FilamentDirectory build/win32-bootstrap/filament-x86 -DownloadBaseUrl "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ inputs.product }}-x86
          path: |
            dist/releases/*.zip
            dist/releases/*-Setup.exe
            dist/releases/*.json
          if-no-files-found: error
