name: Linux ARM64 Game Runtime
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: linux-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ccache ninja-build libssl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev
          python -m pip install -r requirements-build.txt PySide6==6.10.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sdk
        with:
          path: deps/filament
          key: filament-1.77.0-linux-arm64-v1
      - name: Native pinned ARM64 renderer SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: python scripts/build_arm64_dependencies.py --platform linux
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: deps/filament
          key: filament-1.77.0-linux-arm64-v1
      - name: Pinned engine dependencies
        run: |
          for dependency in entt rapidyaml sdl3 stb_image lua sol2 miniaudio jolt freetype text_shaping; do sh "scripts/get_${dependency}.sh"; done
      - name: Build and verify native runtime
        run: |
          cmake -S . -B build/arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBAZZALT_BUILD_EDITOR_BRIDGE=OFF -DBUILD_TESTING=ON
          cmake --build build/arm64 --parallel 2
          ctest --test-dir build/arm64 --output-on-failure
      - name: Package Core and runtime template
        run: python scripts/package_arm64.py --platform linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime-arm64
          path: dist/*-arm64.zip*
          if-no-files-found: error
