name: Android Runtime
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            architecture: arm64
          - abi: x86_64
            architecture: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install host tools and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libvulkan-dev
          python -m pip install -r requirements-build.txt PySide6==6.10.2
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            deps/filament-android
            deps/openssl-android
            build/android-bootstrap
          key: android-dependencies-r29-filament177-rtti-${{ matrix.abi }}-v1
      - name: Fetch pinned engine sources
        run: |
          for dependency in entt rapidyaml sdl3 lua sol2 miniaudio jolt yojimbo freetype text_shaping; do sh "scripts/get_${dependency}.sh"; done
      - name: Validate Android settings and real APK tooling
        env:
          BAZZALT_ANDROID_SDK_TESTS: '1'
        run: python -m unittest Compiler.tests.test_android Compiler.tests.test_android_sdk -v
      - name: Build pinned Android dependencies on CI
        run: |
          python scripts/build_android_dependencies.py --abi "${{ matrix.abi }}" --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Cross compile shared runtime
        run: |
          cmake -S . -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DBAZZALT_FILAMENT_DIR="$PWD/deps/filament-android/${{ matrix.abi }}" \
            -DOPENSSL_ROOT_DIR="$PWD/deps/openssl-android/${{ matrix.abi }}" \
            -DBAZZALT_BUILD_EDITOR_BRIDGE=OFF -DBUILD_TESTING=OFF
          cmake --build build/android --parallel 2
          python scripts/package_android.py --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-runtime-${{ matrix.architecture }}
          path: dist/releases/*
