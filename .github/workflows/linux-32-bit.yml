name: Linux 32-bit Game Runtime
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: linux-x86-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CC: clang
      CXX: clang++
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install host tools and 32-bit runtime development libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config g++-multilib libssl-dev:i386 libx11-dev:i386 libx11-xcb-dev:i386 libxcb1-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxi-dev:i386 libxfixes-dev:i386 libxss-dev:i386 libxtst-dev:i386 libgl1-mesa-dev:i386 libvulkan-dev:i386 mesa-vulkan-drivers:i386 xvfb
          python -m pip install -r requirements-build.txt PySide6==6.10.2
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: filament
        with:
          path: build/linux32-bootstrap/filament-x86
          key: linux-filament-x86-v1.77.0-clang18-libstdcxx-${{ hashFiles('scripts/build_linux_x86_dependencies.sh', 'scripts/patch_filament_win32.py', 'scripts/patch_filament_linux_x86.py', 'scripts/test_bluegl_linux_x86.py', 'tests/FilamentThreadAnnotationsProbe.cpp') }}
      - name: Fetch engine dependencies and check callbacks and number parsing
        run: |
          for dependency in entt rapidyaml sdl3 lua sol2 miniaudio freetype text_shaping; do sh "scripts/get_${dependency}.sh"; done
          clang++ -m32 -std=c++20 -stdlib=libstdc++ -fsyntax-only -Ideps/sol2/include -Ideps/lua/src tests/Sol2CompatibilityProbe.cpp
          clang++ -m32 -std=c++20 -stdlib=libstdc++ -Isrc tests/NumberParsingTests.cpp -o number-parsing-probe
          ./number-parsing-probe
      - name: Build pinned x86 Filament SDK on CI
        if: steps.filament.outputs.cache-hit != 'true'
        run: sh scripts/build_linux_x86_dependencies.sh
      - name: Save completed Filament SDK before engine tests
        if: steps.filament.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/linux32-bootstrap/filament-x86
          key: ${{ steps.filament.outputs.cache-primary-key }}
      - name: Build x86 core, GUI, Lua and player without editor or Python bridge
        run: |
          cmake -S . -B build/linux-x86 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBAZZALT_BUILD_EDITOR_BRIDGE=OFF -DBAZZALT_FILAMENT_DIR="$PWD/build/linux32-bootstrap/filament-x86" -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_ASM_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32 -DCMAKE_LIBRARY_PATH=/usr/lib/i386-linux-gnu -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so
          cmake --build build/linux-x86 --parallel 2
          ctest --test-dir build/linux-x86 --output-on-failure
      - name: Stage and audit x86 runtime template and Core SDK
        run: python scripts/package_linux_x86.py
      - name: Verify an encrypted x86 game and render its native window
        env:
          QT_QPA_PLATFORM: offscreen
          BAZZALT_LINUX_TEST_BUILD: build/linux-x86
          BAZZALT_LINUX_TEST_ARCH: x86
        run: xvfb-run -a python -m unittest Compiler.tests.test_linux_build -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime-x86
          path: dist/linux-x86/*
          if-no-files-found: error
