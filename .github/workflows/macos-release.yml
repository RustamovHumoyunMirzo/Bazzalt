name: macOS Release Suite
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/macos-64-bit.yml
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            architecture: x64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          brew install ninja ccache openssl@3 pkg-config
          python -m pip install -r requirements-build.txt PySide6==6.10.2 pybind11==3.0.2
          for dependency in entt rapidyaml filament sdl3 stb_image lua sol2 miniaudio jolt freetype text_shaping pybind11; do sh "scripts/get_${dependency}.sh"; done
          BAZZALT_MAC_ARCH=${{ matrix.cmake_arch }} sh scripts/build_macos_dependencies.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DBAZZALT_FILAMENT_METAL=ON -DBAZZALT_FILAMENT_OPENGL=OFF -DBAZZALT_FILAMENT_VULKAN=OFF
          cmake --build build --parallel 3
          python scripts/build_macos_release.py --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-products-${{ matrix.architecture }}
          path: dist/releases/*
