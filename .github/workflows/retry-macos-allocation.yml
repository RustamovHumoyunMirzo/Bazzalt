name: Recover macOS runner allocation
on:
  workflow_run:
    workflows: [macOS 64-bit, macOS Release Suite]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  retry:
    if: >-
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Privileged workflow: execute only trusted default-branch code, never a PR ref/artifact.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          persist-credentials: false
      - name: Retry only confirmed pre-step allocation failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/retry_macos_allocation.py
